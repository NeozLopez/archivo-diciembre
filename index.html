<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Una experiencia de aniversario para Lau y Diego." />
    <title>Lau & Diego — Nuestra historia</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="site-shell">
      <div id="music-player-slot"></div>
      <section id="experience" class="experience" aria-live="polite"></section>
    </main>

    <template id="password-template">
      <section class="terminal-screen">
        <p class="terminal-screen__status">[ SISTEMA DE ACCESO PRIVADO ]</p>
        <h1>ARCHIVO CIFRADO</h1>
        <p class="terminal-screen__copy">Identidad requerida para continuar.</p>
        <form class="terminal-form" data-password-form>
          <label for="access-password">CONTRASEÑA</label>
          <input id="access-password" type="password" autocomplete="off" required />
          <button type="submit">Comenzar</button>
          <p class="terminal-form__feedback" data-password-feedback></p>
        </form>
      </section>
    </template>

    <template id="gate-template">
      <section class="hero hero--gate">
        <h1 data-gate-title>Para Lau, mi amocito de parte de Diego....</h1>
        <button class="enter-button" type="button" data-enter>Comenzar</button>
        <form class="gate-question level-card" data-question-form hidden>
          <h2 class="gate-question__title" data-question></h2>
          <fieldset>
            <legend class="sr-only">Elige una fecha</legend>
            <div class="date-options" data-options></div>
          </fieldset>
          <button class="continue-button">Verificar respuesta</button>
          <p class="feedback" data-feedback></p>
        </form>
        <dialog class="error-dialog" data-error-dialog>
          <img src="assets/images/error.webp" alt="Perrito con expresión sorprendida" />
          <p>Respuesta incorrecta</p>
          <button class="continue-button" type="button" data-retry>Intentar de nuevo</button>
        </dialog>
        <dialog class="success-dialog" data-success-dialog>
          <img src="assets/images/correcto.webp" alt="Perrito celebrando" />
          <p>Correcto</p>
          <button class="continue-button" type="button" data-continue>Continuar</button>
        </dialog>
      </section>
    </template>

    <template id="game-template">
      <section class="game-flow">
        <article class="level-card" data-level-card></article>
        <dialog class="error-dialog" data-game-error-dialog>
          <img src="assets/images/error.webp" alt="Perrito con expresión sorprendida" />
          <p>Respuesta incorrecta</p>
          <button class="continue-button" type="button" data-game-retry>Intentar de nuevo</button>
        </dialog>
        <dialog class="success-dialog" data-game-success-dialog>
          <img src="assets/images/correcto.webp" alt="Perrito celebrando" />
          <p>Correcto</p>
          <button class="continue-button" type="button" data-game-continue>Continuar</button>
        </dialog>
        <dialog class="photo-dialog" data-photo-dialog>
          <button class="photo-dialog__close" type="button" aria-label="Cerrar foto" data-photo-dialog-close>×</button>
          <img data-photo-dialog-image />
          <p data-photo-dialog-note></p>
        </dialog>
      </section>
    </template>

    <script src="js/data.js"></script>
    <script src="js/game.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
